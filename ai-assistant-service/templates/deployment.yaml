apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-assistant-service.fullname" . }}
  labels:
    app: {{ include "ai-assistant-service.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "ai-assistant-service.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "ai-assistant-service.name" . }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.spring.profilesActive }}
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PORT
            - name: DB_NAME
              value: {{ .Values.spring.dbName }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: REGION
              value: {{ .Values.observability.region | quote }}
            - name: CLUSTER
              value: {{ .Values.observability.cluster | quote }}
            - name: APP_LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: app-config
                  key: APP_LOG_LEVEL
                  optional: true
            # Trust secret shared with api-gateway (arrives as X-Gateway-Secret);
            # HeaderAuthenticationFilter fails closed when it is absent.
            - name: GATEWAY_TRUSTED_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-trust
                  key: GATEWAY_TRUSTED_SECRET
            # Plan weights for max-per-plan scoring (internal course-service API).
            # Named *_URI like the other feign targets (executor-service uses a
            # separate *_URL name for the same host — different env namespace,
            # no collision). The default below covers stg; override only to
            # point elsewhere.
            - name: COURSE_SERVICE_URI
              value: http://grading-course-service:8081
            # Sibling read path (internal result-service API).
            - name: RESULT_SERVICE_URI
              value: http://grading-result-service:8084
            # LLM provider settings from the ai-credentials secret (created by
            # deploy/setup-namespace.sh). Blank AI_API_KEY = fallback mode.
            - name: AI_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: ai-credentials
                  key: AI_PROVIDER
                  optional: true
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-credentials
                  key: AI_API_KEY
                  optional: true
            - name: AI_MODEL_NAME
              valueFrom:
                secretKeyRef:
                  name: ai-credentials
                  key: AI_MODEL_NAME
                  optional: true
            - name: AI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-credentials
                  key: AI_BASE_URL
                  optional: true
            - name: AI_MAX_COMPLETION_TOKENS
              value: {{ .Values.ai.maxCompletionTokens | default 4096 | quote }}
            # Agent/chat model (separate from explanation)
            - name: AI_AGENT_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: ai-credentials
                  key: AI_AGENT_PROVIDER
                  optional: true
            - name: AI_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-credentials
                  key: AI_AGENT_API_KEY
                  optional: true
            - name: AI_AGENT_MODEL_NAME
              valueFrom:
                secretKeyRef:
                  name: ai-credentials
                  key: AI_AGENT_MODEL_NAME
                  optional: true
            - name: AI_AGENT_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-credentials
                  key: AI_AGENT_BASE_URL
                  optional: true
            # Explanation model (separate from agent/chat)
            - name: AI_EXPLAIN_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: ai-credentials
                  key: AI_EXPLAIN_PROVIDER
                  optional: true
            - name: AI_EXPLAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-credentials
                  key: AI_EXPLAIN_API_KEY
                  optional: true
            - name: AI_EXPLAIN_MODEL_NAME
              valueFrom:
                secretKeyRef:
                  name: ai-credentials
                  key: AI_EXPLAIN_MODEL_NAME
                  optional: true
            - name: AI_EXPLAIN_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-credentials
                  key: AI_EXPLAIN_BASE_URL
                  optional: true
            - name: AI_EXPLAIN_MAX_COMPLETION_TOKENS
              value: {{ .Values.ai.explanation.maxCompletionTokens | quote }}
            - name: AGENT_MAX_MODEL_STEPS
              value: {{ .Values.agent.limits.maxModelSteps | quote }}
            - name: AGENT_MAX_TOOL_CALLS
              value: {{ .Values.agent.limits.maxToolCalls | quote }}
            - name: AGENT_MAX_MODEL_ATTEMPTS
              value: {{ .Values.agent.limits.maxModelAttempts | quote }}
            - name: AGENT_MAX_VALIDATION_REPAIRS
              value: {{ .Values.agent.limits.maxValidationRepairs | quote }}
            - name: AGENT_MAX_LOOKUP_ROUNDS
              value: {{ .Values.agent.limits.maxLookupRounds | quote }}
            - name: AGENT_ACTIVE_TIMEOUT_SECONDS
              value: {{ .Values.agent.limits.activeTimeoutSeconds | quote }}
            - name: AGENT_MODEL_MAX_RETRIES
              value: {{ .Values.agent.retry.modelMaxRetries | quote }}
            - name: AGENT_SAFE_TOOL_MAX_RETRIES
              value: {{ .Values.agent.retry.safeToolMaxRetries | quote }}
            - name: AGENT_MAX_INPUT_TOKENS
              value: {{ .Values.agent.context.maxInputTokens | quote }}
            - name: AGENT_OUTPUT_RESERVE
              value: {{ .Values.agent.context.outputReserve | quote }}
            - name: AGENT_SAFETY_MARGIN
              value: {{ .Values.agent.context.safetyMargin | quote }}
            - name: AGENT_HISTORY_WINDOW_SIZE
              value: {{ .Values.agent.context.historyWindowSize | quote }}
            - name: AGENT_TOOL_SEARCH_LIMIT
              value: {{ .Values.agent.context.toolSearchLimit | quote }}
            - name: AGENT_HISTORY_MAX_TOKENS
              value: {{ .Values.agent.context.historyMaxTokens | quote }}
            - name: AGENT_TOOL_MAX_TOKENS
              value: {{ .Values.agent.context.toolMaxTokens | quote }}
            - name: AGENT_STORED_TOOL_RESULT_TTL_MINUTES
              value: {{ .Values.agent.context.storedToolResultTtlMinutes | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Probes target Spring Boot's Kubernetes health groups, NOT the root
          # /actuator/health. The root endpoint also runs the `db` indicator,
          # which blocks ~14s while a suspended Neon compute wakes up; with the
          # 1s default probe timeout that failed 3 times in a row and kubelet
          # SIGTERM'd the pod in a restart loop (observed 2026-10-17). The
          # livenessState/readinessState groups answer in ms and never touch the
          # database. The startupProbe gives the cold JVM (~80s) its own budget
          # so liveness does not race application startup.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.service.port }}
            periodSeconds: 30
            timeoutSeconds: 5
