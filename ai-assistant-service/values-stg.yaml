global:
  domain: vucongtuanduong.dpdns.org
  prefix: web-dev1

image:
  registry: docker.io
  repository: vucongtuanduong/web-grading-system-ai-assistant-service
  tag: "v1.0.19"
  pullPolicy: Always

spring:
  profilesActive: stg
  dbName: ai_db

observability:
  region: dev
  cluster: k3s-local

service:
  type: ClusterIP
  port: 8086

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

ai:
  maxCompletionTokens: 4096
  explanation:
    maxCompletionTokens: 4096

agent:
  limits:
    maxModelSteps: 8
    maxToolCalls: 12
    maxModelAttempts: 16
    maxValidationRepairs: 2
    maxLookupRounds: 1
    activeTimeoutSeconds: 120
  retry:
    modelMaxRetries: 2
    safeToolMaxRetries: 2
  context:
    maxInputTokens: 64000
    outputReserve: 4096
    safetyMargin: 2000
    historyWindowSize: 10
    toolSearchLimit: 6
    historyMaxTokens: 40000
    toolMaxTokens: 24000
    storedToolResultTtlMinutes: 60
