global:
  domain: vucongtuanduong.dpdns.org
  prefix: web-dev1

image:
  registry: docker.io
  repository: vucongtuanduong/web-grading-system-api-gateway
  tag: "v1.0.10"
  pullPolicy: Always

spring:
  profilesActive: stg

observability:
  region: dev
  cluster: k3s-local

serviceUris:
  course: http://grading-course-service:8081
  submission: http://grading-submission-service:8082
  result: http://grading-result-service:8084

# Issuer the api-gateway resource server validates access tokens against.
keycloak:
  issuerUri: https://web-dev1-keycloak.vucongtuanduong.dpdns.org/realms/ptit-wgs

# UC-14 change-password exposure (Pullfrog review 2026-10-04): true = endpoint registered,
# false = 404 (fail closed). Gate only, no limiter behind it yet.
rateLimit:
  enabled: true

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi
