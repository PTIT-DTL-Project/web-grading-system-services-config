apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-gateway.fullname" . }}
  labels:
    app: {{ include "api-gateway.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "api-gateway.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "api-gateway.name" . }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.spring.profilesActive }}
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PORT
            - name: DB_NAME
              value: {{ .Values.spring.dbName }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: REGION
              value: {{ .Values.observability.region | quote }}
            - name: CLUSTER
              value: {{ .Values.observability.cluster | quote }}
            - name: APP_LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: app-config
                  key: APP_LOG_LEVEL
                  optional: true
            # Keycloak issuer the resource server validates tokens against; without
            # it the gateway falls back to its localhost default and every
            # authenticated request fails at first use, not at boot.
            - name: KEYCLOAK_ISSUER_URI
              value: {{ .Values.keycloak.issuerUri | quote }}
          {{- range $name, $uri := .Values.serviceUris }}
            - name: {{ $name | upper }}_SERVICE_URI
              value: {{ $uri | quote }}
          {{- end }}
            # Shared secret stamped as X-Gateway-Secret on forwarded requests.
            - name: GATEWAY_TRUSTED_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-trust
                  key: GATEWAY_TRUSTED_SECRET
            # Keycloak Admin client used by POST /api/v1/account/change-password
            # (user lookup + reset-password). WHY this never reaches the frontend:
            # the FE used to embed VITE_KEYCLOAK_ADMIN_CLIENT_SECRET in the browser
            # bundle, handing every visitor a credential that could reset any
            # password — since 2026-10-03 the call runs here and the secret stays
            # in the keycloak-admin-client K8s Secret only.
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-client
                  key: KEYCLOAK_ADMIN_CLIENT_ID
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-client
                  key: KEYCLOAK_ADMIN_CLIENT_SECRET
            # Client whose password grant verifies currentPassword in
            # POST /api/v1/account/change-password (step 2). Phase 3 (2026-10-03, D11):
            # Direct Access Grants are switched off on the browser's web-grading-fe, so
            # the gateway authenticates against its own confidential wgs-password-verify
            # instead — id + secret read from the SAME keycloak-admin-client Secret, never
            # as a plain value in git. setup-namespace.sh always writes both keys (the id
            # falls back to web-grading-fe, so this env is never blank) and refuses a
            # half-set pair: one side only means invalid_client → 502 on that endpoint.
            # A blank secret is legal and keeps the old public-client behaviour.
            - name: KEYCLOAK_PASSWORD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-client
                  key: KEYCLOAK_PASSWORD_CLIENT_ID
            - name: KEYCLOAK_PASSWORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-client
                  key: KEYCLOAK_PASSWORD_CLIENT_SECRET
            # Exposure switch for POST /api/v1/account/change-password (Pullfrog review
            # 2026-10-04): the controller only registers when this is true, so an
            # unconfigured deployment answers 404 instead of exposing the public
            # password-verification path. No limiter sits behind the flag yet — Keycloak
            # brute force is the throttle. Default true here because stg is opted in;
            # override to "false" to fail closed in an environment.
            # hasKey, not `default`: Go templates treat false as empty, so `default true`
            # would swallow an explicit "false". Missing key falls back to true (opted in).
            - name: RATE_LIMIT_ENABLED
              value: {{ if hasKey (.Values.rateLimit | default dict) "enabled" }}{{ .Values.rateLimit.enabled | quote }}{{ else }}"true"{{ end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
