apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "executor-service.fullname" . }}
  labels:
    app: {{ include "executor-service.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "executor-service.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "executor-service.name" . }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.spring.profilesActive }}
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PORT
            - name: DB_NAME
              value: {{ .Values.spring.dbName }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: REGION
              value: {{ .Values.observability.region | quote }}
            - name: CLUSTER
              value: {{ .Values.observability.cluster | quote }}
            - name: APP_LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: app-config
                  key: APP_LOG_LEVEL
                  optional: true
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: kafka-aiven-credentials
                  key: bootstrap-servers
                  optional: true
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-aiven-credentials
                  key: username
                  optional: true
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-aiven-credentials
                  key: password
                  optional: true
            - name: KAFKA_CA_PATH
              value: /etc/kafka/secrets/ca.pem
            - name: RUSTFS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: RUSTFS_ENDPOINT
                  optional: true
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: RUSTFS_ACCESS_KEY
                  optional: true
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: RUSTFS_SECRET_KEY
                  optional: true
            - name: RUSTFS_PUBLIC_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: RUSTFS_PUBLIC_ENDPOINT
                  optional: true
            - name: RUSTFS_BUCKET_NAME
              value: submission-files
            - name: COURSE_SERVICE_URL
              value: http://grading-course-service:8081
            - name: SUBMISSION_SERVICE_URL
              value: http://grading-submission-service:8082
            - name: RESULT_SERVICE_URL
              value: http://grading-result-service:8084
            - name: TESTCONTAINERS_RYUK_DISABLED
              value: "true"
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/kafka/secrets
              readOnly: true
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
        - name: dind
          image: docker:27-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          ports:
            - containerPort: 2375
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
      volumes:
        - name: kafka-ca
          secret:
            secretName: kafka-aiven-credentials
            items:
              - key: ca.pem
                path: ca.pem
        - name: dind-storage
          emptyDir: {}
